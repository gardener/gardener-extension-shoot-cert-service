name: Build
on:
  push:
    branches:
      - master
      - 'release-v*'
  pull_request:

  pull_request_target:
    types:
      - labeled

jobs:
  build:
    # only run in the main repo, and for pull_request_target only when the
    # `ok-to-test` label was added (so fork PRs build only after a maintainer
    # vets them; the label name is hardcoded in gardener/cc-utils's
    # trusted-checkout action).
    if: ${{ github.repository == 'gardener/gardener-extension-shoot-cert-service' && (github.event_name != 'pull_request_target' || (github.event_name == 'pull_request_target' && github.event.label.name == vars.DEFAULT_LABEL_OK_TO_TEST && vars.DEFAULT_LABEL_OK_TO_TEST != '')) }}
    uses: ./.github/workflows/build.yaml
    with:
      mode: snapshot
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write

  component-descriptor:
    if: ${{ github.repository == 'gardener/gardener-extension-shoot-cert-service' && (github.event_name != 'pull_request_target' || (github.event_name == 'pull_request_target' && github.event.label.name == vars.DEFAULT_LABEL_OK_TO_TEST && vars.DEFAULT_LABEL_OK_TO_TEST != '')) }}
    uses: gardener/cc-utils/.github/workflows/post-build.yaml@v1
    needs:
      - build
    permissions:
      id-token: write
      contents: write
